version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - SESSION_SECRET=${SESSION_SECRET:-docker-session-secret}
      - NODE_ENV=production
    volumes:
      - db-data:/app/prisma
    restart: unless-stopped

volumes:
  db-data: